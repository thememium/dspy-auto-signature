[project]
name = "dspy-auto-signature"
version = "0.1.1"
description = "Generate DSPy Signatures from any prompt using a DSPy meta-program"
readme = "README.md"
authors = [{ name = "Edward Boswell", email = "thememium@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["dspy>=3.2.1", "pydantic>=2.13.4"]
keywords = ["dspy", "ai"]
classifiers = [
  "Operating System :: OS Independent",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/thememium/dspy-auto-signature"
Documentation = "https://github.com/thememium/dspy-auto-signature"
Repository = "https://github.com/thememium/dspy-auto-signature.git"
Issues = "https://github.com/thememium/dspy-auto-signature/issues"
Changelog = "https://github.com/thememium/dspy-auto-signature/blob/master/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dataset = ["pandas>=2.0"]
all = ["pandas>=2.0"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "boto3>=1.43.15",
  "deptry>=0.25.1",
  "isort>=8.0.1",
  "poethepoet>=0.46.0",
  "pytest>=9.0.3",
  "ruff>=0.15.14",
  "ty>=0.0.39",
  "usechange>=0.1.35",
  "pandas>=2.0",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore:.*prefix.*:DeprecationWarning:dspy.*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dspy_auto_signature*"]

[tool.deptry]
known_first_party = ["dspy_auto_signature"]

[tool.poe.tasks]
example-basic = "uv run ./examples/basic.py"
example-dataset = "uv run ./examples/dataset.py"
example-sdk = "uv run ./examples/sdk.py"
clean-full = "sh -c 'uv run isort . && uv run ruff check . --fix && uv run ruff format . && uv run deptry . && uv run ty check'"
clean = "sh -c 'uv run isort . && uv run ruff format .'"
test = "uv run pytest tests/ -v"
sort = "uv run isort ."
lint = "uv run ruff check ."
format = "uv run ruff format ."
deptry = "uv deptry ."
typecheck = "uv run ty check"
release = "uv run usechange release"
